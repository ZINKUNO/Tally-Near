[package]
name = "tally"
version = "1.0.0"
description = "Tally: an AI agent may pay only for an item a merchant signed, at the signed price, inside the owner's rules"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.30"
tally-menu = { path = "../../crates/tally-menu" }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
near-workspaces = { version = "0.24", features = ["unstable"] }
tokio = { version = "1.12.0", features = ["full"] }
serde_json = "1"
bs58 = "0.5"
