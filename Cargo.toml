[workspace]
resolver = "2"
members = ["crates/tally-menu", "contracts/tally", "contracts/tusdc"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/ZINKUNO/Tally-Near"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
